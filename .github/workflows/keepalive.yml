# Keeps the free Render service awake and the free Turso database active.
#
# Render puts a free web service to sleep after 15 idle minutes (the next
# visitor then waits ~30-60 s) and Turso archives a free database after 10
# idle days. A request every 5 minutes prevents both. One always-on free
# service uses ~744 of Render's 750 free hours a month, so this fits.
#
# The shop's address is read from the repository variable APP_URL
# (Settings → Secrets and variables → Actions → Variables). deploy.sh sets it.
#
# GitHub disables scheduled workflows in repositories with no commits for
# 60 days, so the second job makes an empty commit once a month.

name: Keep the shop awake

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    if: github.event.schedule != '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /healthz
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          URL="${APP_URL:-https://metal-menagerie.onrender.com}"
          echo "Pinging $URL/healthz"
          # Up to 90 s: a sleeping service needs time to wake for the first request.
          curl -fsS --max-time 90 --retry 2 --retry-delay 15 "$URL/healthz"

  touch:
    if: github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit so GitHub keeps this schedule enabled
        run: |
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: monthly heartbeat [skip render]"
          git push
